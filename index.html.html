<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중국어 단어 게임</title>
<style>
:root {
  --bg:#f7f8fb; --card:#fff; --text:#20242c; --muted:#6b7280; --accent:#5b7cfa;
  --accent2:#8b5cf6; --good:#10b981; --bad:#ef4444; --line:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans SC",sans-serif;background:linear-gradient(160deg,#f8fbff,#f7f5ff);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:22px}
.hero{text-align:center;padding:18px 10px 6px}
.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px}
.hero p{margin:0;color:var(--muted)}
.panel{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 35px rgba(0,0,0,.06);margin-top:18px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
button{font:inherit}
.gameBtn{border:0;border-radius:20px;padding:22px;background:white;border:1px solid var(--line);cursor:pointer;text-align:left;transition:.2s}
.gameBtn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.gameBtn strong{display:block;font-size:22px;margin-bottom:6px}
.gameBtn span{color:var(--muted)}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.pill{background:#f3f4f6;border-radius:999px;padding:8px 12px;font-weight:700}
.secondary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:800}
.hidden{display:none!important}

.match-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.match-card{min-height:104px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;cursor:pointer;transition:.18s;user-select:none}
.match-card:hover{transform:translateY(-1px)}
.match-card.selected{outline:3px solid #c7d2fe;background:#eef2ff}
.match-card.matched{opacity:.18;pointer-events:none;transform:scale(.96)}
.match-card.bad{animation:shake .25s}
.big-hanzi{font-size:28px;font-weight:800}
.py{font-size:16px;color:var(--accent2);font-weight:700}
.mean{font-size:15px;color:var(--muted)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.quiz-box{text-align:center;padding:10px 0 4px}
.quiz-word{font-size:52px;font-weight:900;margin:8px 0 0}
.quiz-pinyin{font-size:22px;color:var(--accent2);font-weight:800;margin-bottom:18px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:680px;margin:0 auto}
.option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;cursor:pointer;font-size:18px;min-height:64px}
.option.correct{background:#ecfdf5;border-color:#a7f3d0}
.option.wrong{background:#fef2f2;border-color:#fecaca}
.feedback{height:34px;font-weight:800;margin-top:14px}
.result{text-align:center;padding:26px 10px}
.result h2{font-size:34px;margin-bottom:8px}
.missed{max-width:620px;margin:16px auto 0;text-align:left}
.missed-item{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:7px 0}

footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 0 6px}
@media(max-width:720px){
  .menu{grid-template-columns:1fr}
  .match-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .options{grid-template-columns:1fr}
  .match-card{min-height:90px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>🐼 중국어 단어 게임</h1>
    <p>한자 · 병음 · 뜻을 게임으로 반복 연습해 보세요.</p>
  </section>

  <section id="menu" class="panel">
    <div class="menu">
      <button class="gameBtn" onclick="startMatch()">
        <strong>🧩 짝 맞추기</strong>
        <span>한자와 병음·뜻 카드를 찾아 짝을 맞춰요.</span>
      </button>
      <button class="gameBtn" onclick="startQuiz()">
        <strong>⚡ 4지선다 스피드 퀴즈</strong>
        <span>한자와 병음을 보고 뜻을 빠르게 선택해요.</span>
      </button>
    </div>
  </section>

  <section id="match" class="panel hidden">
    <div class="topbar">
      <button class="secondary" onclick="goMenu()">← 게임 선택</button>
      <div>
        <span class="pill">⏱ <span id="matchTime">0</span>초</span>
        <span class="pill">✅ <span id="matchScore">0</span>/<span id="matchTotal">0</span></span>
      </div>
    </div>
    <div id="matchGrid" class="match-grid"></div>
    <div id="matchDone" class="result hidden">
      <h2>🎉 완성!</h2>
      <p id="matchSummary"></p>
      <button class="primary" onclick="startMatch()">다시 하기</button>
    </div>
  </section>

  <section id="quiz" class="panel hidden">
    <div class="topbar">
      <button class="secondary" onclick="goMenu()">← 게임 선택</button>
      <div>
        <span class="pill">문제 <span id="qNum">1</span>/<span id="qTotal">10</span></span>
        <span class="pill">⭐ <span id="qScore">0</span></span>
      </div>
    </div>
    <div id="quizPlay" class="quiz-box">
      <div id="qHanzi" class="quiz-word"></div>
      <div id="qPinyin" class="quiz-pinyin"></div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
    </div>
    <div id="quizDone" class="result hidden">
      <h2 id="resultTitle">완료!</h2>
      <p id="resultText"></p>
      <div id="missed" class="missed"></div>
      <button class="primary" onclick="startQuiz()">다시 하기</button>
    </div>
  </section>

  <footer>교과서 단어 연습용 · 인터넷 연결 없이 실행 가능</footer>
</div>

<script>
const WORDS = [{"hanzi": "要", "pinyin": "yào", "meaning": "~하려고 하다"}, {"hanzi": "买", "pinyin": "mǎi", "meaning": "사다"}, {"hanzi": "旗袍", "pinyin": "qípáo", "meaning": "치파오"}, {"hanzi": "件", "pinyin": "jiàn", "meaning": "벌, 건 (양사)"}, {"hanzi": "多少", "pinyin": "duōshao", "meaning": "얼마, 몇"}, {"hanzi": "钱", "pinyin": "qián", "meaning": "돈"}, {"hanzi": "百", "pinyin": "bǎi", "meaning": "100, 백"}, {"hanzi": "块", "pinyin": "kuài", "meaning": "위안 (구어)"}, {"hanzi": "太", "pinyin": "tài", "meaning": "너무"}, {"hanzi": "贵", "pinyin": "guì", "meaning": "비싸다"}, {"hanzi": "便宜", "pinyin": "piányi", "meaning": "싸다"}, {"hanzi": "一点儿", "pinyin": "yìdiǎnr", "meaning": "조금, 약간"}];

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function show(id) {
  ["menu","match","quiz"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));
}
function goMenu() { clearInterval(matchTimer); show("menu"); }

let matchTimer=null, matchSeconds=0, matchSelected=null, matchFound=0, locked=false;
function startMatch() {
  show("match");
  clearInterval(matchTimer);
  matchSeconds=0; matchSelected=null; matchFound=0; locked=false;
  document.getElementById("matchTime").textContent="0";
  document.getElementById("matchScore").textContent="0";
  document.getElementById("matchTotal").textContent=WORDS.length;
  document.getElementById("matchDone").classList.add("hidden");
  document.getElementById("matchGrid").classList.remove("hidden");

  const cards=[];
  WORDS.forEach((w,i)=>{
    cards.push({pair:i,type:"hanzi",html:`<div><div class="big-hanzi">${w.hanzi}</div></div>`});
    cards.push({pair:i,type:"info",html:`<div><div class="py">${w.pinyin}</div><div class="mean">${w.meaning}</div></div>`});
  });
  const grid=document.getElementById("matchGrid"); grid.innerHTML="";
  shuffle(cards).forEach(c=>{
    const b=document.createElement("button");
    b.className="match-card"; b.dataset.pair=c.pair; b.dataset.type=c.type; b.innerHTML=c.html;
    b.onclick=()=>pickMatch(b); grid.appendChild(b);
  });
  matchTimer=setInterval(()=>{matchSeconds++;document.getElementById("matchTime").textContent=matchSeconds},1000);
}
function pickMatch(card) {
  if(locked || card.classList.contains("matched")) return;
  if(!matchSelected) { matchSelected=card; card.classList.add("selected"); return; }
  if(card===matchSelected) return;
  const a=matchSelected;
  const ok=a.dataset.pair===card.dataset.pair && a.dataset.type!==card.dataset.type;
  if(ok) {
    a.classList.remove("selected"); a.classList.add("matched"); card.classList.add("matched");
    matchFound++; document.getElementById("matchScore").textContent=matchFound; matchSelected=null;
    if(matchFound===WORDS.length) {
      clearInterval(matchTimer);
      setTimeout(()=>{
        document.getElementById("matchGrid").classList.add("hidden");
        document.getElementById("matchDone").classList.remove("hidden");
        document.getElementById("matchSummary").textContent=`12개 단어를 ${matchSeconds}초 만에 모두 맞혔어요!`;
      },250);
    }
  } else {
    locked=true; card.classList.add("bad"); a.classList.add("bad");
    setTimeout(()=>{ card.classList.remove("bad"); a.classList.remove("bad","selected"); matchSelected=null; locked=false; },420);
  }
}

let quizWords=[], qi=0, qScore=0, missed=[];
function startQuiz() {
  show("quiz");
  quizWords=shuffle(WORDS).slice(0,10); qi=0; qScore=0; missed=[];
  document.getElementById("qTotal").textContent=quizWords.length;
  document.getElementById("qScore").textContent="0";
  document.getElementById("quizPlay").classList.remove("hidden");
  document.getElementById("quizDone").classList.add("hidden");
  renderQuestion();
}
function renderQuestion() {
  const w=quizWords[qi];
  document.getElementById("qNum").textContent=qi+1;
  document.getElementById("qHanzi").textContent=w.hanzi;
  document.getElementById("qPinyin").textContent=w.pinyin;
  document.getElementById("feedback").textContent="";
  let wrongs=shuffle(WORDS.filter(x=>x!==w)).slice(0,3).map(x=>x.meaning);
  const opts=shuffle([w.meaning,...wrongs]);
  const box=document.getElementById("options"); box.innerHTML="";
  opts.forEach(txt=>{
    const b=document.createElement("button"); b.className="option"; b.textContent=txt;
    b.onclick=()=>answerQuiz(b,txt,w); box.appendChild(b);
  });
}
function answerQuiz(btn,txt,w) {
  document.querySelectorAll(".option").forEach(b=>b.disabled=true);
  const ok=txt===w.meaning;
  if(ok) {
    qScore++; btn.classList.add("correct");
    document.getElementById("feedback").textContent="정답! 👍";
  } else {
    btn.classList.add("wrong"); missed.push(w);
    document.getElementById("feedback").textContent=`정답: ${w.meaning}`;
    [...document.querySelectorAll(".option")].find(b=>b.textContent===w.meaning)?.classList.add("correct");
  }
  document.getElementById("qScore").textContent=qScore;
  setTimeout(()=>{ qi++; if(qi<quizWords.length) renderQuestion(); else finishQuiz(); },850);
}
function finishQuiz() {
  document.getElementById("quizPlay").classList.add("hidden");
  document.getElementById("quizDone").classList.remove("hidden");
  document.getElementById("resultTitle").textContent=qScore===10?"🏆 만점!":qScore>=8?"👏 아주 좋아요!":"📚 한 번 더!";
  document.getElementById("resultText").textContent=`10문제 중 ${qScore}문제를 맞혔어요.`;
  const m=document.getElementById("missed");
  if(missed.length===0) {
    m.innerHTML="<p>틀린 단어가 없어요!</p>";
  } else {
    m.innerHTML="<h3>오답 단어</h3>"+missed.map(w=>`<div class="missed-item"><b>${w.hanzi}</b> · <span class="py">${w.pinyin}</span> · ${w.meaning}</div>`).join("");
  }
}
</script>
</body>
</html>
